<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5a151f"/>
      <stop offset="100%" stop-color="#34090e"/>
    </linearGradient>
    <!-- Gold Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fceda2"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#aa8014"/>
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-opacity="0.3"/>
    </filter>
  </defs>

  <!-- Circular Outer Badge -->
  <circle cx="32" cy="32" r="30" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="32" cy="32" r="26.5" fill="none" stroke="rgba(212, 175, 55, 0.4)" stroke-width="0.75" stroke-dasharray="2 1.5"/>

  <!-- Spice Leaf Accent -->
  <path d="M32 12 C37 16, 40 21, 37 25 C34 29, 29 27, 28 23 C27 18, 30 14, 32 12 Z" fill="#48bb78" opacity="0.95"/>
  <path d="M32 12 C33 17, 33 21, 31 24" stroke="#2f855a" stroke-width="0.8" fill="none"/>

  <!-- Fork & Spoon Cloche Motif -->
  <g filter="url(#shadow)" stroke="url(#goldGrad)" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Cloche Lid Curve -->
    <path d="M18 37 C18 28.5, 46 28.5, 46 37 Z" fill="url(#goldGrad)" fill-opacity="0.2" stroke-width="2"/>
    <circle cx="32" cy="27" r="2.2" fill="url(#goldGrad)"/>
    <!-- Cloche Base Plate -->
    <path d="M15 40 L49 40" stroke-width="2.5"/>
    <path d="M20 43 L44 43" stroke-width="1.5" opacity="0.8"/>

    <!-- Fork Detail inside cloche -->
    <path d="M28 32 L28 36" stroke-width="1.2"/>
    <path d="M32 31 L32 36" stroke-width="1.2"/>
    <path d="M36 32 L36 36" stroke-width="1.2"/>
  </g>

  <!-- Bottom Accent Stars -->
  <circle cx="27" cy="48" r="1" fill="url(#goldGrad)"/>
  <polygon points="32,46.5 33,49 35.5,49 33.5,50.5 34.2,53 32,51.5 29.8,53 30.5,50.5 28.5,49 31,49" fill="url(#goldGrad)"/>
  <circle cx="37" cy="48" r="1" fill="url(#goldGrad)"/>
</svg>
